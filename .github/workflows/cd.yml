name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purchases-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/purchases-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purchases-streamlit:latest
            ghcr.io/${{ github.repository_owner }}/purchases-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
