name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r fastapi/requirements.txt

      - name: Run pytest
        working-directory: fastapi
        run: pytest test_main.py -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint FastAPI
        run: ruff check fastapi/

      - name: Lint Streamlit
        run: ruff check streamlit/

  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi
          push: false
          tags: purchases-fastapi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit
          push: false
          tags: purchases-streamlit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
