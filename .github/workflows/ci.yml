name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: purchases_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r fastapi/requirements.txt

      - name: Run pytest
        working-directory: fastapi
        run: pytest test_main.py -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Check for missing migrations (alembic check)
        working-directory: fastapi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/purchases_test
        run: |
          alembic upgrade head
          alembic check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint FastAPI
        run: ruff check fastapi/

      - name: Lint Streamlit
        run: ruff check streamlit/

  validate-manifests:
    name: Validate Helm & K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart (dev)
        run: helm lint ./helm -f helm/values.yaml -f helm/values-dev.yaml

      - name: Lint Helm chart (prod)
        run: helm lint ./helm -f helm/values.yaml -f helm/values-prod.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered K8s manifests (kubeconform)
        run: |
          helm template purchases ./helm \
            -f helm/values.yaml \
            -f helm/values-dev.yaml \
            --set fastapi.image=ghcr.io/test/purchases-fastapi \
            --set streamlit.image=ghcr.io/test/purchases-streamlit \
          | kubeconform -strict -ignore-missing-schemas -summary

  docker-build:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi
          push: false
          tags: purchases-fastapi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit
          push: false
          tags: purchases-streamlit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Scan FastAPI image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: purchases-fastapi:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan Streamlit image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: purchases-streamlit:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
