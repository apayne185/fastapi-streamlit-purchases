services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: purchases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: ./fastapi
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/purchases
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    build: ./streamlit
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://fastapi:8000
    depends_on:
      - fastapi

volumes:
  postgres_data:
