apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.fastapi.replicas }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: fastapi
          image: {{ .Values.fastapi.image }}:{{ .Values.fastapi.tag }}
          imagePullPolicy: {{ .Values.fastapi.imagePullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: purchases-config
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.fastapi.resources.requests.cpu }}
              memory: {{ .Values.fastapi.resources.requests.memory }}
            limits:
              cpu: {{ .Values.fastapi.resources.limits.cpu }}
              memory: {{ .Values.fastapi.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
