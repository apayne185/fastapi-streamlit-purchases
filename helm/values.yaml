namespace: purchases

fastapi:
  image: ghcr.io/YOUR_GITHUB_USERNAME/purchases-fastapi  # overridden by Makefile automatically
  tag: latest
  secretKey: change-me-in-production  # override per environment or via --set fastapi.secretKey=<value>
  imagePullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

streamlit:
  image: ghcr.io/YOUR_GITHUB_USERNAME/purchases-streamlit  # overridden by Makefile automatically
  tag: latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  image: postgres:15-alpine
  password: postgres
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  uiHost: purchases.local
  apiHost: api.purchases.local
