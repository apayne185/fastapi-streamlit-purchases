apiVersion: v1
kind: ConfigMap
metadata:
  name: purchases-config
  namespace: purchases
data:
  POSTGRES_DB: purchases
  DATABASE_URL: postgresql://postgres:postgres@postgres-service:5432/purchases
  REDIS_URL: redis://redis-service:6379
  OTLP_ENDPOINT: http://jaeger-service:4317
  API_URL: http://fastapi-service:8000
  # Streamlit calls FastAPI server-side (cluster-internal DNS works); React
  # is a static SPA served to the browser, which needs the public ingress
  # host instead -- browsers can't resolve fastapi-service.
  REACT_API_URL: http://api.purchases.local
