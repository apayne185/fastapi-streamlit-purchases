[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so a fresh `pip install ruff` in CI can't silently pick up
# new default-enabled rule categories from a newer ruff release than what's
# been checked against this codebase. E4/E7/E9/F is ruff's own documented
# default set (pycodestyle errors + pyflakes).
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",   # line too long (handled by line-length setting)
]

[tool.ruff.lint.per-file-ignores]
"streamlit/app.py" = [
    "E402",   # module-level import not at top (streamlit pattern)
]
